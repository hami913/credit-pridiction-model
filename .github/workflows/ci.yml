name: Credit Default Integration Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            frontend/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test saved model and API without retraining
        run: python -m pytest -c backend/pytest.ini backend/tests -v
      - name: Test Streamlit integration
        env:
          CREDIT_TEST_LIVE: "1"
        run: python -m pytest -c frontend/pytest.ini frontend/tests -v
